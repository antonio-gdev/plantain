[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "plantain-automation"
version = "0.1.0"
description = "YAML-driven AI-assisted UI, API, and database test automation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Plantain maintainers" }]
keywords = ["automation", "playwright", "openapi", "testing", "yaml"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "Faker>=33,<40",
  "filelock>=3.16,<4",
  "httpx[http2]>=0.27,<1",
  "jsonschema[format]>=4.23,<5",
  "openapi-spec-validator>=0.7,<1",
  "playwright>=1.62,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0.2,<7",
  "referencing>=0.35,<1",
  "SQLAlchemy>=2.0.36,<3",
  "sqlglot>=25,<40",
]

[project.optional-dependencies]
dashboard = [
  "reflex>=0.9.8.post1,<0.10",
]
dev = [
  "bandit[toml]>=1.8,<2",
  "hypothesis>=6.120,<7",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12,<7",
  "types-jsonschema>=4.23,<5",
]
docs = [
  "zensical>=0.0.60",
]
database = [
  "mysql-connector-python>=9.1,<10",
  "oracledb>=2.5,<4",
  "psycopg[binary]>=3.2,<4",
  "pyodbc>=5.2,<6",
]
mssql = ["pyodbc>=5.2,<6"]
mysql = ["mysql-connector-python>=9.1,<10"]
oracle = ["oracledb>=2.5,<4"]
postgres = ["psycopg[binary]>=3.2,<4"]
[project.scripts]
plantain = "plantain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plantain"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/assets",
  "/README.md",
  "/pyproject.toml",
  "/rxconfig.py",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "e2e: browser tests against a complete application",
  "external: tests requiring a public or private external service",
  "integration: tests crossing package boundaries",
]

[tool.coverage.run]
branch = true
source = ["plantain"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "F",
  "FAST",
  "FLY",
  "FURB",
  "I",
  "ICN",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T20",
  "TRY",
  "UP",
]
ignore = [
  "PLR0913",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["plantain"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["generated/"]

[tool.bandit]
exclude_dirs = ["tests", "generated"]
skips = []
